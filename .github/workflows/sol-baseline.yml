name: SOL Baseline

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Benchmark profile (quick for testing, full for trusted baselines)'
        required: false
        default: 'full'
        type: choice
        options:
          - quick
          - full
      branch_bin:
        description: 'Branch binary spec, e.g. main=target/release/nockchain-bench'
        required: false
        default: 'main=target/release/nockchain-bench'
        type: string
  push:
    branches: [master]
    paths:
      - 'crates/nockchain-bench/**'
      - 'benchmarks/**'
      - 'scripts/sol_*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bench-history-write
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Build nockchain-bench
        run: cargo build --release -p nockchain-bench

      - name: Build fixtures
        run: |
          if [ -f scripts/sol_build_fixtures.sh ]; then
            echo "Building fixtures..."
            bash scripts/sol_build_fixtures.sh || echo "Fixture build skipped or failed"
          else
            echo "No fixture build script found, skipping"
          fi

      - name: Run baseline
        run: |
          PROFILE="${{ inputs.profile || 'full' }}"
          bash scripts/sol_baseline_ci.sh \
            --profile "$PROFILE" \
            --branch-bin "${{ inputs.branch_bin || 'main=target/release/nockchain-bench' }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sol-baseline-${{ github.sha }}-${{ github.run_number }}
          path: bench-artifacts/sol-baseline/latest/
          retention-days: 90
          if-no-files-found: warn

      - name: Save baseline reference cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p .cache/sol-baseline-ref
          cp bench-artifacts/sol-baseline/latest/data/combined_summary.tsv .cache/sol-baseline-ref/combined_summary.tsv
          echo "Baseline reference updated from ${{ github.sha }}"

      - name: Cache baseline reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: .cache/sol-baseline-ref/
          key: sol-baseline-ref-v1-${{ github.sha }}

      - name: Build history payload
        run: |
          mkdir -p history-payload
          git fetch origin gh-pages 2>/dev/null || true
          EXISTING_INDEX=$(git show origin/gh-pages:history/index.json 2>/dev/null || echo '[]')
          bash scripts/sol_history_append.sh \
            bench-artifacts/sol-baseline/latest/meta/manifest.json \
            bench-artifacts/sol-baseline/latest/data/combined_summary.tsv \
            history-payload \
            "$EXISTING_INDEX"

      - name: Push to history branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./history-payload
          publish_branch: gh-pages
          destination_dir: history
          keep_files: true
          commit_message: "history: run ${{ github.sha }} (${{ github.run_number }})"

  deploy-pages:
    needs: baseline
    uses: ./.github/workflows/sol-pages-deploy.yml
    permissions:
      pages: write
      id-token: write
      contents: read
