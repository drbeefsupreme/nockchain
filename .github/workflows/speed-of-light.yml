name: "Speed of Light Bench (1000 blocks)"

on:
  workflow_dispatch:
  pull_request:
    branches: ["jon/millenium-falcon"]
  push:
    branches: ["jon/millenium-falcon"]

permissions:
  contents: read

jobs:
  sol-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIXTURE_TAG: sol-fixtures
      FIXTURE_ASSET: checkpoint_1000.chkjam.gz
      RUSTFLAGS: "-A deprecated"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Download checkpoint fixture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["FIXTURE_TAG"]
          asset = os.environ["FIXTURE_ASSET"]

          api = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
          req = urllib.request.Request(
              api,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              },
          )
          with urllib.request.urlopen(req) as resp:
              data = json.load(resp)

          url = None
          for item in data.get("assets", []):
              if item.get("name") == asset:
                  url = item.get("url")
                  break
          if not url:
              sys.exit(f"Asset {asset} not found in release tag {tag}")

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/octet-stream",
              },
          )
          with urllib.request.urlopen(req) as resp, open(asset, "wb") as f:
              f.write(resp.read())
          PY
          gzip -dc "$FIXTURE_ASSET" > checkpoint_1000.chkjam

      - name: Build dumb.jam from source
        run: |
          set -euo pipefail
          cargo build --release --locked --bin hoonc
          mkdir -p assets
          rm -f assets/dumb.jam
          ./target/release/hoonc hoon/apps/dumbnet/outer.hoon hoon
          mv out.jam assets/dumb.jam
          touch assets/wal.jam assets/miner.jam assets/peek.jam

      - name: Build archive (first 1000 blocks)
        run: |
          cargo run --locked --release -p nockchain-bench -- \
            sol extract -n 1000 -c checkpoint_1000.chkjam -k assets/dumb.jam -o blocks_1000.solarch

      - name: Run speed-of-light benchmark (1000 blocks)
        run: |
          cargo run --locked --release -p nockchain-bench -- \
            sol bench -a blocks_1000.solarch -k assets/dumb.jam -n 1000
