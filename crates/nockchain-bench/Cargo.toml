[package]
name = "nockchain-bench"
version = "0.1.0"
edition = "2021"
description = "Benchmarking and memory profiling harness for Nockchain"

[[bin]]
name = "nockchain-bench"
path = "src/main.rs"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bollard = "0.18"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
arrow = { version = "54", default-features = false }
parquet = { version = "54", default-features = false, features = ["arrow", "snap"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { workspace = true }
tracing-tracy = { workspace = true, features = ["enable", "manual-lifetime", "ondemand"] }
bytes = "1.4"
blake3 = "1"
bincode = "1.3"

# Speed-of-light dependencies
nockapp = { path = "../nockapp" }
nockvm = { path = "../nockvm/rust/nockvm" }
nockchain-types = { path = "../nockchain-types" }
nockchain-math = { path = "../nockchain-math" }
noun-serde = { path = "../noun-serde" }
zkvm-jetpack = { path = "../zkvm-jetpack" }

[dev-dependencies]
tempfile = "3.10"
